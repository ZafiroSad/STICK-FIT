const VIEWS=[["hoy","Hoy"],["progreso","Progreso"],["rutinas","Rutinas"],["ejercicios","Ejercicios"],["nutricion","Nutrición"]];
/* El dock se construye UNA sola vez y despues solo se mueve la pildora.
   Antes se reescribia el innerHTML entero en cada cambio de vista: con eso
   la pildora se destruia y volvia a nacer en su nuevo sitio, que es
   justamente el efecto que el sistema no quiere (STICK_UI_SYSTEM.md §4.5 —
   una sola pildora que VIAJA, como el `layoutId` de las apps React). */
function montarDock(){
  const dock=$("#dock");
  dock.innerHTML='<span class="dock-pildora" id="dockPildora"></span>'+
    VIEWS.map(([id,l])=>`<button class="dock-btn${id===curView?" on":""}" data-view="${id}" title="${l}" aria-label="${l}">${IC[id]}<span class="dl">${l}</span></button>`).join("");
  // El botón Hoy del dock siempre lleva a hoy, aunque se estuviera viendo otra semana.
  dock.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
    if(b.dataset.view==="hoy"){weekOffset=0;selectedDay=jsDayToId();}
    go(b.dataset.view);
  });
  // Al cambiar de ancho (girar el telefono, abrir/cerrar teclado) las
  // etiquetas aparecen o desaparecen y los botones cambian de ancho: la
  // pildora tiene que volver a medirse o queda corrida.
  window.addEventListener("resize",()=>renderDock(true),{passive:true});
  renderDock(true);
}
function renderDock(inmediato){
  const dock=$("#dock");if(!dock)return;
  const pildora=$("#dockPildora");if(!pildora)return;
  let activo=null;
  dock.querySelectorAll("[data-view]").forEach(b=>{
    const on=b.dataset.view===curView;
    b.classList.toggle("on",on);
    b.setAttribute("aria-current",on?"page":"false");
    if(on)activo=b;
  });
  if(!activo)return;
  // Con `#app` todavia en display:none (portada), todo mide 0: colocar la
  // pildora ahi la dejaria naciendo en el borde izquierdo. Se sale y ya se
  // volvera a llamar al mostrar la app.
  if(activo.offsetWidth===0)return;
  // La primera colocacion va sin transicion: si no, la pildora entra
  // volando desde el borde izquierdo la primera vez que carga la app.
  if(inmediato){pildora.style.transition="none";}
  pildora.style.setProperty("--px",activo.offsetLeft+"px");
  pildora.style.setProperty("--pw",activo.offsetWidth+"px");
  if(inmediato){void pildora.offsetWidth;pildora.style.transition="";}
}
function go(v){
  curView=v;
  document.querySelectorAll(".view").forEach(el=>el.classList.remove("on"));
  const el=$("#v-"+v);el.classList.add("on");el.classList.remove("animate-page");void el.offsetWidth;el.classList.add("animate-page");
  ({hoy:renderHoy,progreso:renderProgreso,rutinas:renderRutinas,ejercicios:renderEjercicios,nutricion:renderNutricion})[v]();
  renderDock();
  $("#headerSub").textContent=VIEWS.find(x=>x[0]===v)[1].toUpperCase();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- Sheet helpers ---------- */
function openSheet(html){$("#sheet").innerHTML=html;$("#overlay").classList.add("open");
  $("#sheet").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);}
function closeSheet(){$("#overlay").classList.remove("open");}
$("#overlay").onclick=e=>{if(e.target===$("#overlay"))closeSheet();};
/* Segundo overlay apilado (para selectores abiertos desde otra hoja, ej. añadir ejercicio) */
function openSheet2(html){$("#sheet2").innerHTML=html;$("#overlay2").classList.add("open");
  $("#sheet2").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet2);}
/* Gancho de cierre de un solo uso: lo usa el diagrama de medidas para apagar el músculo
   resaltado se cierre como se cierre la hoja (botón, scrim o guardado). */
let sheet2Hook=null;
function closeSheet2(){$("#overlay2").classList.remove("open");
  if(sheet2Hook){const f=sheet2Hook;sheet2Hook=null;f();}}
$("#overlay2").onclick=e=>{if(e.target===$("#overlay2"))closeSheet2();};

/* Hojas reutilizables (reemplazan prompt()/confirm() nativos) */
function promptSheet(o){
  openSheet2(`<div class="sheet-grab"></div><div class="sheet-head"><div class="h2">${o.title}</div><button class="close-x" data-close>×</button></div>
    <div class="field" style="margin-top:12px"><label>${o.label||""}</label><input type="text" id="ps-input" value="${(o.value||"").replace(/"/g,"&quot;")}" placeholder="${o.placeholder||""}"></div>
    <button class="btn-primary" style="width:100%" id="ps-save">${o.cta||"Guardar"}</button>`);
  const inp=$("#ps-input");inp.focus();try{inp.select();}catch(_){}
  $("#ps-save").onclick=()=>{const v=inp.value.trim();if(!v)return toast("Escribe un nombre");closeSheet2();o.onSave(v);};
}
function confirmSheet(o){
  openSheet2(`<div class="sheet-grab"></div><div class="sheet-head"><div class="h2">${o.title}</div><button class="close-x" data-close>×</button></div>
    <p class="sub" style="margin:8px 0 18px">${o.message||""}</p>
    <div style="display:flex;gap:8px">
      <button class="btn-secondary" style="flex:1" data-close>Cancelar</button>
      <button class="${o.danger?"btn-danger":"btn-primary"}" style="flex:1" id="cs-ok">${o.cta||"Confirmar"}</button>
    </div>`);
  $("#cs-ok").onclick=()=>{closeSheet2();o.onConfirm();};
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg){$("#toastMsg").textContent=msg;$("#toast").classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>$("#toast").classList.remove("show"),1900);}

/* ---------- Portada ---------- */
$("#enterBtn").onclick=()=>{S.onboarded=true;save();$("#cover").style.display="none";$("#app").style.display="block";go("hoy");renderDock(true);};
$("#coverBtn").onclick=()=>{$("#cover").style.display="flex";$("#app").style.display="none";};

/* ---------- Arranque ---------- */
montarDock();
if(S.onboarded){$("#cover").style.display="none";$("#app").style.display="block";go("hoy");renderDock(true);}
else{go("hoy");}

/* ---------- Anti-zoom (familia Stick) ----------
   Safari en iOS IGNORA `user-scalable=no` y `maximum-scale` desde iOS 10, así
   que el meta viewport no basta: el zoom hay que interceptarlo evento por
   evento. Todos los listeners van en `document` con `passive:false` (sin eso
   el navegador ignora el preventDefault en eventos táctiles).
   Detalle en STICK_UI_SYSTEM.md §6.6.1. */
(function(){
  const stop=e=>e.preventDefault();

  // 1. Escritorio: pinch de trackpad y Ctrl+rueda llegan como 'wheel'.
  document.addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});

  // 2. Safari (iOS y macOS): eventos propietarios del pinch.
  for(const t of ["gesturestart","gesturechange","gestureend"])
    document.addEventListener(t,stop,{passive:false});

  // 3. iPhone: el pinch real son dos dedos. Cortarlo aquí es lo único que de
  //    verdad frena el zoom en Safari móvil.
  document.addEventListener("touchstart",e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
  document.addEventListener("touchmove", e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});

  // 4. iPhone: doble toque para hacer zoom. Se anula solo si los dos toques
  //    caen en el mismo punto (<30px) y en menos de 300ms — así marcar dos
  //    ejercicios seguidos NO pierde el segundo toque.
  let tPrev=0,xPrev=0,yPrev=0;
  document.addEventListener("touchend",e=>{
    const t=e.changedTouches[0]; if(!t) return;
    if(e.timeStamp-tPrev<=300 && Math.abs(t.clientX-xPrev)<30 && Math.abs(t.clientY-yPrev)<30)
      e.preventDefault();
    tPrev=e.timeStamp; xPrev=t.clientX; yPrev=t.clientY;
  },{passive:false});

  // 5. Atajo de teclado. El navegador lo reserva y no siempre cede.
  document.addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey)&&["+","-","=","_","0"].includes(e.key))e.preventDefault();
  },{passive:false});
})();

/* ---------- Modo claro (STICK_UI_SYSTEM.md §10) ----------
   La clase `light` ya la pone el script anti-destello del <head> antes del
   primer pintado; aquí solo se alterna y se persiste. */
$("#btnTema").addEventListener("click",()=>{
  const claro=document.documentElement.classList.toggle("light");
  try{localStorage.setItem("stick:tema",claro?"claro":"oscuro");}catch(e){}
  $("#btnTema").title=claro?"Modo oscuro":"Modo claro";
});

/* ---------- PWA: service worker (offline + instalable) ---------- */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
}
