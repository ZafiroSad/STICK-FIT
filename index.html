<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STICK FIT">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>STICK FIT</title>
<style>
/* ============================================================
   STICK FIT — sistema visual STICK (dark-first zinc) en CSS puro
   ============================================================ */
:root{
  --bg:#0c0d10;
  --zinc-950:#09090b; --zinc-900:#18181b; --zinc-850:#1f1f23; --zinc-800:#27272a;
  --zinc-750:#333338; --zinc-700:#3f3f46; --zinc-650:#494951; --zinc-600:#52525b;
  --zinc-550:#62626b; --zinc-500:#71717a; --zinc-450:#898992; --zinc-400:#a1a1aa;
  --zinc-350:#babac1; --zinc-300:#d4d4d8; --zinc-200:#e4e4e7; --zinc-100:#f4f4f5;
  --emerald:#34d399; --rose:#fb7185; --amber:#fbbf24; --amber-250:#fddf6e; --sky:#38bdf8;
  --font:'Century Gothic','AppleGothic','Trebuchet MS',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);font-family:var(--font);-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--zinc-100);font-family:var(--font);
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(1200px 700px at 50% -10%,rgba(82,82,91,.06),transparent 60%);
}
button,input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--zinc-700);border-radius:99px}
.no-sb::-webkit-scrollbar{display:none}
.no-sb{-ms-overflow-style:none;scrollbar-width:none}
.num{font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* ── Animaciones ── */
@keyframes fade-in{from{opacity:0;transform:scale(.99)}to{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes item{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes scaleUp{from{opacity:0;transform:scale(.93) translateY(12px);filter:blur(3px)}to{opacity:1;transform:scale(1) translateY(0);filter:blur(0)}}
@keyframes page{from{opacity:0;transform:translateY(20px);filter:blur(4px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
.animate-page{animation:page .40s var(--ease) both}
.list-stagger>*{animation:item .38s var(--ease) both}
.list-stagger>*:nth-child(1){animation-delay:0ms}
.list-stagger>*:nth-child(2){animation-delay:55ms}
.list-stagger>*:nth-child(3){animation-delay:110ms}
.list-stagger>*:nth-child(4){animation-delay:165ms}
.list-stagger>*:nth-child(5){animation-delay:220ms}
.list-stagger>*:nth-child(6){animation-delay:275ms}
.list-stagger>*:nth-child(7){animation-delay:330ms}
.list-stagger>*:nth-child(8){animation-delay:385ms}

/* ── Tarjetas ── */
.card{
  background:rgba(31,31,35,.60);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:22px;border:1px solid rgba(63,63,70,.40);
  box-shadow:0 8px 32px rgba(0,0,0,.35);
  transition:border-color .35s var(--ease),box-shadow .35s var(--ease),transform .35s var(--ease);
}
.card.hoverable:hover{border-color:rgba(82,82,91,.65);transform:translateY(-3px);
  box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04)}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.985)}

/* ── Texto ── */
.h1{font-size:26px;font-weight:700;letter-spacing:-.02em;color:#fff}
.h2{font-size:20px;font-weight:700;letter-spacing:-.01em;color:#fff}
.h3{font-size:16px;font-weight:700;color:#fff}
.label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--zinc-500)}
.label-mono{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--zinc-400)}
.sub{font-size:13px;color:var(--zinc-400);line-height:1.5}
.muted{color:var(--zinc-500);font-size:12px}
.dim{color:var(--zinc-600)}

/* ── Botones ── */
.btn-primary{
  background:#fff;color:#000;border:none;border-radius:12px;padding:13px 18px;
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
  transition:transform .2s var(--ease),background .15s ease,box-shadow .2s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary:hover{background:#e4e4e7;transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.btn-primary:active{transform:scale(.97);box-shadow:none}
.btn-primary:disabled{background:var(--zinc-800);color:var(--zinc-600);cursor:not-allowed;box-shadow:none}
.btn-secondary{
  background:rgba(24,24,27,.8);color:var(--zinc-200);border:1px solid rgba(63,63,70,.8);
  border-radius:12px;padding:11px 14px;font-size:12px;font-weight:700;cursor:pointer;
  transition:all .2s var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn-secondary:hover{background:rgba(39,39,42,.85);border-color:rgba(82,82,91,.8);transform:translateY(-1px)}
.btn-secondary:active{transform:scale(.97)}
.btn-danger{
  background:rgba(251,113,133,.08);color:var(--rose);border:1px solid rgba(251,113,133,.18);
  border-radius:12px;padding:12px 16px;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;cursor:pointer;transition:all .2s var(--ease);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn-danger:hover{background:rgba(251,113,133,.16);transform:translateY(-1px)}
.icon-btn{
  width:36px;height:36px;border-radius:12px;background:rgba(24,24,27,.8);
  border:1px solid var(--zinc-800);color:var(--zinc-400);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;transition:all .2s var(--ease);flex:none;
}
.icon-btn:hover{color:#fff;border-color:var(--zinc-700)}
.icon-btn:active{transform:scale(.92)}

/* ── Campos de formulario ── */
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--zinc-500);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;background:rgba(9,9,11,.6);border:1px solid var(--zinc-800);border-radius:12px;
  padding:11px 14px;font-size:14px;font-weight:600;color:#fff;outline:none;font-family:inherit;
  font-variant-numeric:tabular-nums;transition:border-color .2s,background .2s,box-shadow .2s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--zinc-600);background:rgba(9,9,11,.8);box-shadow:0 0 0 3px rgba(82,82,91,.15)}
.field select option{background:var(--zinc-900);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  background:rgba(82,82,91,.15);border:1px solid rgba(82,82,91,.3);color:var(--zinc-350)}
.badge.active{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.3);color:var(--emerald)}
.badge.rest{background:rgba(56,189,248,.10);border-color:rgba(56,189,248,.28);color:var(--sky)}
.chip{padding:4px 9px;border-radius:999px;font-size:10px;font-weight:700;
  background:rgba(63,63,70,.35);color:var(--zinc-400);white-space:nowrap}

/* ============ Shell ============ */
#app{display:none;min-height:100vh;padding-bottom:120px}
header.top{
  position:sticky;top:0;z-index:40;background:rgba(12,13,16,.6);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(39,39,42,.4);
  padding-top:env(safe-area-inset-top);
}
.top-inner{height:60px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;max-width:520px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:11px;
  background:linear-gradient(140deg,#26262b,#141418);border:1px solid rgba(63,63,70,.6);
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.brand .name{font-size:14px;font-weight:700;letter-spacing:.02em;color:#fff}
.brand .name b{color:var(--zinc-400);font-weight:700}
main{max-width:520px;margin:0 auto;padding:18px 16px 0}
.view{display:none}
.view.on{display:block}
.view-head{margin-bottom:16px}
.section-gap{margin-top:22px}

/* ── Dock ── */
nav.dock{
  position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  z-index:50;display:flex;align-items:center;justify-content:space-between;gap:2px;
  height:64px;padding:0 8px;width:92%;max-width:400px;border-radius:999px;
  background:rgba(12,13,16,.72);backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,.07);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -1px 0 rgba(0,0,0,.2),
    0 16px 48px rgba(0,0,0,.55),0 4px 16px rgba(0,0,0,.3);
}
.dock-btn{flex:1;height:48px;border:none;background:transparent;cursor:pointer;border-radius:999px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--zinc-500);transition:color .2s var(--ease),background .2s var(--ease)}
.dock-btn .dl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.dock-btn.on{color:#fff;background:rgba(255,255,255,.06)}
.dock-btn:active{transform:scale(.94)}

/* ── Ejercicio row (checklist) ── */
.ex{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;
  background:rgba(24,24,27,.5);border:1px solid rgba(63,63,70,.35);margin-bottom:8px;
  transition:border-color .2s,background .2s}
.ex:active{transform:scale(.99)}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--zinc-600);flex:none;cursor:pointer;
  display:grid;place-items:center;transition:.2s;background:transparent}
.chk svg{width:13px;height:13px;opacity:0;transform:scale(.5);transition:.2s}
.ex.done .chk{background:var(--emerald);border-color:var(--emerald)}
.ex.done .chk svg{opacity:1;transform:scale(1)}
.ex.done .ex-name{color:var(--zinc-500);text-decoration:line-through}
.ex-body{flex:1;min-width:0;cursor:pointer}
.ex-name{font-size:14px;font-weight:700;color:var(--zinc-100)}
.ex-meta{font-size:11px;color:var(--zinc-500);margin-top:2px}
.ex-target{font-size:12px;font-weight:700;color:var(--zinc-350);background:rgba(63,63,70,.35);
  padding:5px 10px;border-radius:8px;white-space:nowrap;flex:none}

/* ── Barra de progreso ── */
.bar{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:#fff;transition:width .4s var(--ease)}

/* ── Selector de días (semana) ── */
.week{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px}
.daypill{flex:none;min-width:66px;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;
  background:rgba(31,31,35,.5);border:1px solid rgba(63,63,70,.35);transition:.2s var(--ease);position:relative}
.daypill .dw{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--zinc-500)}
.daypill .df{font-size:11px;font-weight:700;color:var(--zinc-300);margin-top:4px;line-height:1.2}
.daypill.on{background:#fff;border-color:#fff}
.daypill.on .dw{color:rgba(0,0,0,.55)}
.daypill.on .df{color:#000}
.daypill.rest{opacity:.55}
.daypill .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;
  background:var(--emerald);opacity:0;transition:.2s}
.daypill.complete .dot{opacity:1}
.daypill.on.complete .dot{background:#000}

/* ── Catálogo ejercicios ── */
.cat-group{margin-bottom:18px}
.cat-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;cursor:pointer;
  background:rgba(24,24,27,.4);border:1px solid rgba(63,63,70,.3);margin-bottom:7px;transition:.2s}
.cat-item:hover{border-color:rgba(82,82,91,.6);background:rgba(39,39,42,.5)}
.cat-item:active{transform:scale(.99)}
.mg-ico{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,rgba(63,63,70,.3),rgba(24,24,27,.6));border:1px solid rgba(63,63,70,.4)}

/* ── Modal ── */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(4,5,9,.72);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center;padding:0}
.overlay.open{display:flex;animation:fade-in .2s ease both}
.sheet{background:var(--zinc-950);border:1px solid rgba(39,39,42,.8);border-radius:24px 24px 0 0;
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:22px 18px calc(28px + env(safe-area-inset-bottom));
  animation:scaleUp .32s var(--ease) both;box-shadow:0 -20px 60px rgba(0,0,0,.6)}
@media(min-width:560px){.overlay{align-items:center}.sheet{border-radius:24px;max-height:88vh}}
.sheet-grab{width:38px;height:4px;border-radius:999px;background:var(--zinc-700);margin:0 auto 16px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.close-x{width:32px;height:32px;border-radius:999px;background:rgba(39,39,42,.6);border:none;color:var(--zinc-400);
  cursor:pointer;font-size:18px;display:grid;place-items:center;flex:none;transition:.2s}
.close-x:hover{color:#fff;background:rgba(63,63,70,.7)}

/* ── Diagrama muscular ── */
.muscle-wrap{display:flex;gap:18px;justify-content:center;padding:16px 14px 12px;border-radius:16px;
  background:rgba(9,9,11,.4);border:1px solid rgba(63,63,70,.3);margin:14px 0 8px}
.mfig-col{display:flex;flex-direction:column;align-items:center;gap:7px}
.mfig-cap{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--zinc-600)}
.muscle-wrap svg{width:94px;height:155px;display:block}
.mfig .base{fill:rgba(63,63,70,.20);stroke:rgba(82,82,91,.30);stroke-width:.6}
.mfig .m{fill:rgba(82,82,91,.32);stroke:rgba(9,9,11,.55);stroke-width:.3;transition:fill .3s,filter .3s}
.mfig .m.hot{fill:var(--emerald);filter:drop-shadow(0 0 3px rgba(52,211,153,.55))}
.muscle-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:4px}

/* ── Tech steps ── */
.tech h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:var(--zinc-400);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.tech ol{list-style:none;counter-reset:s}
.tech ol li{counter-increment:s;position:relative;padding:7px 0 7px 30px;font-size:13px;
  color:var(--zinc-300);line-height:1.5;border-top:1px solid rgba(63,63,70,.25)}
.tech ol li:first-child{border-top:none}
.tech ol li::before{content:counter(s);position:absolute;left:0;top:7px;width:20px;height:20px;
  border-radius:7px;background:rgba(63,63,70,.4);color:var(--zinc-300);font-size:10px;font-weight:700;
  display:grid;place-items:center}
.tech ul{list-style:none}
.tech ul li{padding:5px 0 5px 16px;position:relative;font-size:13px;color:var(--zinc-400);line-height:1.5}
.tech ul li::before{content:"";position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;
  background:var(--zinc-600)}
.tech ul.err li::before{background:var(--rose)}
.tech ul.tip li::before{background:var(--emerald)}

/* ── Stat tiles nutrición ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(24,24,27,.5);border:1px solid rgba(63,63,70,.35);border-radius:16px;padding:16px}
.stat .sv{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.02em}
.stat .sv small{font-size:13px;font-weight:700;color:var(--zinc-500);margin-left:3px}
.stat .sl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--zinc-500);margin-top:4px}
.macro-line{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(63,63,70,.25)}
.macro-line:first-child{border-top:none}
.macro-dot{width:10px;height:10px;border-radius:50%;flex:none}
.empty{text-align:center;padding:34px 20px;color:var(--zinc-500)}
.empty .ei{width:52px;height:52px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;
  background:rgba(63,63,70,.2);border:1px solid rgba(63,63,70,.4)}

/* ── Portada ── */
#cover{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:32px;
  background:radial-gradient(900px 600px at 50% 30%,rgba(82,82,91,.10),transparent 60%),var(--bg);
  padding-top:calc(32px + env(safe-area-inset-top))}
#cover .mark-lg{width:74px;height:74px;border-radius:22px;
  background:linear-gradient(140deg,#26262b,#141418);border:1px solid rgba(63,63,70,.6);
  display:grid;place-items:center;box-shadow:0 20px 50px rgba(0,0,0,.55);margin-bottom:26px;
  animation:rise .5s var(--ease) both}
#cover h1{font-size:38px;font-weight:800;letter-spacing:-.01em;color:#fff;animation:rise .5s .05s var(--ease) both}
#cover .tag{color:var(--zinc-400);font-size:14px;line-height:1.6;max-width:300px;margin:14px 0 34px;
  animation:rise .5s .1s var(--ease) both}
#cover .btn-primary{padding:15px 30px;font-size:13px;animation:rise .5s .15s var(--ease) both}
#cover .foot{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));font-size:10px;
  color:var(--zinc-700);text-transform:uppercase;letter-spacing:.16em}

.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:120;background:var(--zinc-900);border:1px solid rgba(63,63,70,.6);border-radius:14px;
  padding:12px 18px;font-size:13px;font-weight:600;color:#fff;display:flex;align-items:center;gap:10px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .tdot{width:8px;height:8px;border-radius:50%;background:var(--emerald)}

/* ── Meal plan (nutrición) ── */
.mp-meal{padding:10px 0;border-top:1px solid rgba(63,63,70,.25)}
.mp-meal.first{border-top:none;padding-top:0}
.mp-meal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mp-meal-name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--zinc-400)}
.mp-foods{display:flex;flex-direction:column;gap:3px}
.mp-foods span{font-size:13px;color:var(--zinc-300);padding-left:14px;position:relative}
.mp-foods span::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--zinc-600)}
</style>
</head>
<body>

<!-- ══════════════ PORTADA ══════════════ -->
<div id="cover">
  <div class="mark-lg">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M8 9v6M16 9v6"/>
    </svg>
  </div>
  <h1>STICK <b style="color:var(--zinc-400)">FIT</b></h1>

      // migración: refresca solo la rutina semilla "Protocolo Base" sin tocar rutinas propias, logs ni perfil
      if(raw.seedVersion!==SEED_VERSION){
        const i=raw.routines.findIndex(r=>r.id===SEED_ROUTINE.id);

/* ============================================================
   VISTA: HOY
   ============================================================ */
function checkKey(dayId,exIdx){return `${todayKey()}|${dayId}|${exIdx}`;}
function isChecked(dayId,exIdx){return !!S.checks[checkKey(dayId,exIdx)];}
function dayProgress(dayId){
  const day=activeRoutine().days[dayId];
  if(!day||day.rest||!day.exercises.length)return 0;
  const done=day.exercises.filter((_,i)=>isChecked(dayId,i)).length;
  return Math.round(done/day.exercises.length*100);
}
function renderHoy(){
  const r=activeRoutine();
  const day=r.days[selectedDay];
  const isToday=selectedDay===jsDayToId();
  let h=`<div class="view-head">
    <div class="label">${isToday?"Hoy · "+DAYNAME[selectedDay]:DAYNAME[selectedDay]}</div>
    <div class="h1" style="margin-top:2px">${day.rest?"Descanso":day.focus}</div>
    <div class="sub" style="margin-top:4px">Rutina activa · <b style="color:var(--zinc-300)">${r.name}</b></div>
  </div>`;
  // Semana
  h+=`<div class="week">`+DAYS.map(([id,lbl])=>{
    const dd=r.days[id];const pct=dayProgress(id);
    return `<div class="daypill${id===selectedDay?" on":""}${dd.rest?" rest":""}${pct===100?" complete":""}" data-day="${id}">
      <span class="dot"></span><div class="dw">${lbl}</div><div class="df">${dd.rest?"Rest":dd.focus.replace(/ [AB]$/,"")}</div></div>`;
  }).join("")+`</div>`;

  if(day.rest){
    h+=`<div class="card" style="padding:26px;text-align:center;margin-top:18px">
      <div class="ei" style="margin:0 auto 14px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.28)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></div>
      <div class="h3">Día de descanso</div>
      <p class="sub" style="margin-top:8px;max-width:300px;margin-left:auto;margin-right:auto">La recuperación es donde el músculo crece. Duerme 7-9 h, hidrátate y muévete ligero.</p>
    </div>`;
    $("#v-hoy").innerHTML=h;bindHoy();return;
  }

  const pct=dayProgress(selectedDay);
  h+=`<div class="card" style="padding:16px 16px 6px;margin-top:18px">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="mono" style="font-size:16px;font-weight:800;min-width:42px;text-align:right">${pct}%</div>
    </div>`;
  h+=`<div class="list-stagger">`;
  day.exercises.forEach((item,i)=>{
    const e=getEx(item.exId);if(!e)return;
    const done=isChecked(selectedDay,i);
    const le=lastEntry(item.exId);
    const sug=le?nextTargetObj(e,le):null;
    h+=`<div class="ex${done?" done":""}" data-idx="${i}">
      <div class="chk" data-check="${i}">${IC.check}</div>
      <div class="ex-body" data-open="${item.exId}">
        <div class="ex-name">${e.name}</div>
        <div class="ex-meta">${e.group}${sug?` · <span style="color:var(--emerald);font-weight:700">objetivo ${sug.weight} kg × ${sug.reps}</span>`:""}</div>
      </div>
      <div class="ex-target mono">${item.sets}×${item.reps}</div>
    </div>`;
  });
  h+=`</div>`;
  h+=`<div style="display:flex;gap:8px;padding:12px 0 6px">
    <button class="btn-secondary" style="flex:1" id="logDay">Registrar pesos</button>
    <button class="btn-secondary" id="resetDay" style="flex:none;width:46px;padding:0" title="Reiniciar día">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/></svg>
    </button>
  </div></div>`;
  $("#v-hoy").innerHTML=h;bindHoy();
}
function bindHoy(){
  $("#v-hoy").querySelectorAll(".daypill").forEach(p=>p.onclick=()=>{selectedDay=p.dataset.day;renderHoy();});
  $("#v-hoy").querySelectorAll("[data-check]").forEach(c=>c.onclick=e=>{
    e.stopPropagation();const i=+c.dataset.check;const k=checkKey(selectedDay,i);
    const nowDone=!S.checks[k];
    S.checks[k]=nowDone;save();renderHoy();
    if(nowDone){try{if(navigator.vibrate)navigator.vibrate(15);}catch(_){}}
  });
  $("#v-hoy").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openExercise(b.dataset.open));
  const rd=$("#resetDay");if(rd)rd.onclick=()=>{
    activeRoutine().days[selectedDay].exercises.forEach((_,i)=>delete S.checks[checkKey(selectedDay,i)]);
    save();renderHoy();toast("Día reiniciado");
  };
  const ld=$("#logDay");if(ld)ld.onclick=()=>openLogSheet(selectedDay);
}

/* ---------- Registro de pesos ---------- */
function lastLog(exId){
  const logs=S.history.filter(l=>l.exId===exId).sort((a,b)=>b.date<a.date?-1:1);
  if(!logs.length)return null;const l=logs[logs.length-1];
  return `${l.weight?l.weight+" kg":""}${l.weight&&l.reps?" · ":""}${l.reps?l.reps+" reps":""}`||null;
}
function openLogSheet(dayId){
  const day=activeRoutine().days[dayId];
  let h=`<div class="sheet-grab"></div><div class="sheet-head"><div><div class="h2">Registrar sesión</div><div class="sub" style="margin-top:2px">${DAYNAME[dayId]} · ${day.focus}</div></div>
    <button class="close-x" data-close>×</button></div>
    <p class="muted" style="margin:6px 0 16px">Anota el peso y reps reales de hoy. Se guarda en tu historial para ver la progresión.</p>`;
  day.exercises.forEach((item,i)=>{
    const e=getEx(item.exId);if(!e)return;
    const le=lastEntry(item.exId);
    const sug=le?nextTargetObj(e,le):null;
    h+=`<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <div class="h3" style="font-size:14px">${e.name}</div>
        <div class="muted mono">${sug?`sugerido ${sug.weight}×${sug.reps}`:`objetivo ${item.sets}×${item.reps}`}</div>
      </div>
      <div class="row2">
        <div class="field" style="margin:0"><label>Peso (kg)</label><input type="number" inputmode="decimal" data-w="${item.exId}" value="${sug?sug.weight:''}" placeholder="${le?le.weight:'kg'}"></div>
        <div class="field" style="margin:0"><label>Reps</label><input type="number" inputmode="numeric" data-r="${item.exId}" value="${sug?sug.reps:''}" placeholder="reps"></div>
      </div></div>`;
  });
  h+=`<button class="btn-primary" style="width:100%;margin-top:8px" id="saveLog">Guardar sesión</button>`;
  openSheet(h);
  $("#saveLog").onclick=()=>{
    let n=0;const date=todayKey();
    day.exercises.forEach(item=>{
      const w=$(`[data-w="${item.exId}"]`);const r=$(`[data-r="${item.exId}"]`);
      const wv=w&&w.value?parseFloat(w.value):null;const rv=r&&r.value?parseInt(r.value):null;
      if(wv||rv){S.history.push({id:uid(),date,exId:item.exId,weight:wv,reps:rv});n++;}
    });
    save();closeSheet();renderHoy();toast(n?`${n} ejercicios registrados`:"Sin cambios");
  };
}

/* ============================================================

function renderRutinas(){
  let h=`<div class="view-head" style="display:flex;justify-content:space-between;align-items:flex-end">
    <div><div class="label">Mis planes</div><div class="h1" style="margin-top:2px">Rutinas</div></div>
    <button class="btn-primary" id="newRoutine">${IC.plus} Nueva</button></div>`;
  h+=`<div class="list-stagger">`;
  S.routines.forEach(r=>{
    const isA=r.id===S.activeRoutineId;
    const trainDays=Object.values(r.days).filter(d=>!d.rest).length;
    const totalEx=Object.values(r.days).reduce((a,d)=>a+d.exercises.length,0);
    h+=`<div class="card hoverable tap" style="padding:16px;margin-bottom:10px" data-routine="${r.id}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div style="min-width:0">
          <div class="h3">${r.name}</div>
          <div class="sub" style="margin-top:4px">${trainDays} días · ${totalEx} ejercicios</div>
        </div>
        ${isA?'<span class="badge active">Activa</span>':'<span class="badge">Guardada</span>'}
      </div>
      <div style="display:flex;gap:5px;margin-top:12px;flex-wrap:wrap">
        ${DAYS.map(([id,l])=>`<span class="chip" style="${r.days[id].rest?'opacity:.4':''}">${l.slice(0,2)}</span>`).join("")}
      </div>
    </div>`;
  });
  h+=`</div>`;
  $("#v-rutinas").innerHTML=h;
  $("#newRoutine").onclick=()=>createRoutine();
  $("#v-rutinas").querySelectorAll("[data-routine]").forEach(c=>c.onclick=()=>openRoutine(c.dataset.routine));
}
function createRoutine(){
  const name=prompt("Nombre de la nueva rutina:","Mi rutina");
  if(!name)return;
  const days={};DAYS.forEach(([id])=>days[id]=d("Descanso",true,[]));
  const r={id:uid(),name:name.trim(),days};
  S.routines.push(r);save();renderRutinas();openRoutine(r.id);toast("Rutina creada");
}
function openRoutine(rid){
  const r=S.routines.find(x=>x.id===rid);if(!r)return;
  const isA=r.id===S.activeRoutineId;
  let h=`<div class="sheet-grab"></div><div class="sheet-head">
    <div style="min-width:0"><div class="h2">${r.name}</div><div class="sub" style="margin-top:2px">${isA?"Rutina activa":"Editar plan semanal"}</div></div>
    <button class="close-x" data-close>×</button></div>`;
  h+=`<div style="display:flex;gap:8px;margin:12px 0 4px">
    ${isA?'<button class="btn-secondary" style="flex:1" disabled>Activa</button>':`<button class="btn-primary" style="flex:1" id="activate">Activar</button>`}
    <button class="btn-secondary" id="renameR" style="flex:none;width:46px;padding:0" title="Renombrar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    <button class="btn-secondary" id="dupR" style="flex:none;width:46px;padding:0" title="Duplicar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
  </div>`;
  h+=`<div style="margin-top:14px">`;
  DAYS.forEach(([id,lbl])=>{
    const day=r.days[id];
    h+=`<div class="card" style="padding:14px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><span class="label-mono">${DAYNAME[id]}</span>
          <div class="h3" style="font-size:14px;margin-top:3px">${day.rest?"Descanso":day.focus}</div></div>
        <div style="display:flex;gap:6px">
          ${day.rest?`<button class="icon-btn" data-edit-day="${id}" title="Convertir en entreno">${IC.plus}</button>`:
            `<button class="icon-btn" data-edit-day="${id}" title="Editar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>`}
        </div>
      </div>
      ${!day.rest&&day.exercises.length?`<div style="margin-top:10px;display:flex;flex-direction:column;gap:4px">${day.exercises.map(item=>{const e=getEx(item.exId);return `<div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:var(--zinc-300)">${e?e.name:"?"}</span><span class="mono muted">${item.sets}×${item.reps}</span></div>`;}).join("")}</div>`:""}
    </div>`;
  });
  h+=`</div>`;
  if(S.routines.length>1)h+=`<button class="btn-danger" style="width:100%;margin-top:8px" id="delR">Eliminar rutina</button>`;
  openSheet(h);
  const act=$("#activate");if(act)act.onclick=()=>{S.activeRoutineId=r.id;save();closeSheet();renderRutinas();renderHoy();toast("Rutina activada");};
  $("#renameR").onclick=()=>{const n=prompt("Nuevo nombre:",r.name);if(n){r.name=n.trim();save();openRoutine(rid);renderRutinas();}};
  $("#dupR").onclick=()=>{const c=structuredClone(r);c.id=uid();c.name=r.name+" (copia)";S.routines.push(c);save();closeSheet();renderRutinas();toast("Rutina duplicada");};
  const del=$("#delR");if(del)del.onclick=()=>{if(confirm("¿Eliminar esta rutina?")){S.routines=S.routines.filter(x=>x.id!==rid);if(S.activeRoutineId===rid)S.activeRoutineId=S.routines[0].id;save();closeSheet();renderRutinas();renderHoy();toast("Rutina eliminada");}};
  $("#sheet").querySelectorAll("[data-edit-day]").forEach(b=>b.onclick=()=>editDay(rid,b.dataset.editDay));
}
function editDay(rid,dayId){
  const r=S.routines.find(x=>x.id===rid);const day=r.days[dayId];
  let h=`<div class="sheet-grab"></div><div class="sheet-head">
    <div><span class="label-mono">${DAYNAME[dayId]}</span><div class="h2" style="margin-top:2px">Editar día</div></div>
    <button class="close-x" data-close>×</button></div>`;
  h+=`<div class="field" style="margin-top:12px"><label>Enfoque del día</label>
    <input type="text" id="dayFocus" value="${day.rest?'':day.focus}" placeholder="Ej. Torso A, Empuje, Pierna"></div>`;
  h+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px">
    <span class="sub">Marcar como descanso</span>
    <button class="btn-secondary" id="toggleRest">${day.rest?"Es descanso":"Es entreno"}</button></div>`;
  h+=`<div id="dayExList"></div>`;
  h+=`<button class="btn-secondary" style="width:100%;margin:6px 0" id="addEx">${IC.plus} Añadir ejercicio</button>`;
  h+=`<button class="btn-primary" style="width:100%;margin-top:6px" id="saveDay">Guardar día</button>`;
  openSheet(h);
  let draft=day.rest?[]:structuredClone(day.exercises);
  let isRest=day.rest;
  function renderList(){
    const el=$("#dayExList");
    if(isRest){el.innerHTML=`<p class="muted" style="text-align:center;padding:12px">Día de descanso — sin ejercicios.</p>`;return;}
    if(!draft.length){el.innerHTML=`<p class="muted" style="text-align:center;padding:12px">Sin ejercicios aún. Añade desde el catálogo.</p>`;return;}
    el.innerHTML=draft.map((item,i)=>{const e=getEx(item.exId);return `
      <div class="card" style="padding:12px;margin-bottom:7px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span class="h3" style="font-size:13px">${e?e.name:"?"}</span>
          <button class="icon-btn" data-rm="${i}" style="width:30px;height:30px" title="Quitar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="row2">
          <div class="field" style="margin:0"><label>Series</label><input type="number" inputmode="numeric" data-s="${i}" value="${item.sets}"></div>
          <div class="field" style="margin:0"><label>Reps</label><input type="text" data-rp="${i}" value="${item.reps}"></div>
        </div>
      </div>`;}).join("");
    el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{draft.splice(+b.dataset.rm,1);renderList();});
    el.querySelectorAll("[data-s]").forEach(inp=>inp.onchange=()=>draft[+inp.dataset.s].sets=parseInt(inp.value)||1);
    el.querySelectorAll("[data-rp]").forEach(inp=>inp.onchange=()=>draft[+inp.dataset.rp].reps=inp.value.trim()||"10");
  }
  renderList();
  $("#toggleRest").onclick=()=>{isRest=!isRest;$("#toggleRest").textContent=isRest?"Es descanso":"Es entreno";renderList();};
  $("#addEx").onclick=()=>pickExercise(exId=>{draft.push(it(exId,3,"10-12"));isRest=false;$("#toggleRest").textContent="Es entreno";renderList();});
  $("#saveDay").onclick=()=>{
    if(isRest){r.days[dayId]=d("Descanso",true,[]);}
    else{const f=$("#dayFocus").value.trim()||"Entreno";r.days[dayId]=d(f,false,draft);}
    save();openRoutine(rid);renderRutinas();renderHoy();toast("Día guardado");
  };
}
function pickExercise(cb){
  let h=`<div class="sheet-grab"></div><div class="sheet-head"><div class="h2">Añadir ejercicio</div><button class="close-x" data-close>×</button></div>
    <div class="field" style="margin-top:10px"><input type="text" id="exSearch" placeholder="Buscar ejercicio..."></div><div id="pickList"></div>`;
  openSheet(h);
  function draw(q){
    q=(q||"").toLowerCase();
    const list=$("#pickList");let out="";
    GROUPS.forEach(g=>{
      const items=allEx().filter(e=>e.group===g&&e.name.toLowerCase().includes(q));
      if(!items.length)return;
      out+=`<div class="label-mono" style="margin:14px 0 8px">${g}</div>`;
      out+=items.map(e=>`<div class="cat-item" data-pick="${e.id}"><div class="mg-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--zinc-400)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${MG_ICON[g]}"/></svg></div><div style="flex:1"><div class="ex-name" style="font-size:13px">${e.name}</div><div class="ex-meta">${e.eq} · ${e.sets}×${e.reps}</div></div>${IC.chevron}</div>`).join("");
    });
    list.innerHTML=out||`<p class="muted" style="text-align:center;padding:20px">Sin resultados.</p>`;
    list.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{cb(b.dataset.pick);closeSheet();});
  }
  draw("");
  $("#exSearch").oninput=e=>draw(e.target.value);
}

/* ============================================================
   VISTA: EJERCICIOS (catálogo)
   ============================================================ */
function renderEjercicios(){
  let h=`<div class="view-head" style="display:flex;justify-content:space-between;align-items:flex-end">
    <div><div class="label">Base de datos</div><div class="h1" style="margin-top:2px">Ejercicios</div></div>
    <button class="btn-secondary" id="newEx">${IC.plus} Crear</button></div>`;
  h+=`<div class="field"><input type="text" id="catSearch" placeholder="Buscar..."></div>`;
  h+=`<div id="catList"></div>`;
  $("#v-ejercicios").innerHTML=h;
  const draw=q=>{
    q=(q||"").toLowerCase();let out="";
    GROUPS.forEach(g=>{
      const items=allEx().filter(e=>e.group===g&&e.name.toLowerCase().includes(q));
      if(!items.length)return;
      out+=`<div class="cat-group"><div class="label-mono" style="margin-bottom:9px">${g} · ${items.length}</div>`;
      out+=items.map(e=>`<div class="cat-item" data-open="${e.id}">

function sparkline(vals,color){
  color=color||"#ffffff";
  if(!vals||vals.length<2)return `<div class="muted" style="padding:8px 0">Registra al menos 2 datos para ver la tendencia.</div>`;
  const W=280,H=54,pad=5;
  const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
  const X=i=>pad+(i/(vals.length-1))*(W-2*pad);
  const Y=v=>H-pad-((v-min)/rng)*(H-2*pad);
  const line=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const area=`${pad},${H-pad} ${line} ${W-pad},${H-pad}`;
  const lv=vals[vals.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:52px;display:block">
    <polygon points="${area}" fill="${color}" opacity="0.09"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(vals.length-1).toFixed(1)}" cy="${Y(lv).toFixed(1)}" r="3.2" fill="${color}"/>
  </svg>`;
}
function weeksBetween(d1,d2){return Math.max(0,(new Date(d2)-new Date(d1))/(6048e5));}
const RATE_LABEL={"0.5":"+0.5 kg/sem (agresivo)","0.25":"+0.25 kg/sem (magro)","0":"Mantener peso","-0.25":"-0.25 kg/sem","-0.5":"-0.5 kg/sem (definición)"};
function goalRateFromNutrition(){
  if(!S.profile)return "0.25";
  return {magro:"0.25",recomp:"0",deficit:"-0.5"}[S.profile.goal]||"0.25";
}

function weightBlock(){
  const logs=(S.weightLog||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const cur=logs.length?logs[logs.length-1].kg:null;
  const g=S.weightGoal;
  let h=`<div class="card" style="padding:18px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="h3">Peso corporal</div>

      </div>
    </div>`;
  if(cur==null&&!g){
    h+=`<div class="empty" style="padding:12px 8px"><p class="sub">Aún no registras tu peso. Pulsa <b style="color:var(--zinc-300)">Registrar</b> para empezar y define tu meta con el botón de diana.</p></div></div>`;
    return h;
  }
  h+=`<div style="display:flex;align-items:flex-end;gap:22px;margin-bottom:14px;flex-wrap:wrap">
    <div><div class="label">Actual</div><div class="mono" style="font-size:34px;font-weight:800;color:#fff;line-height:1">${cur!=null?cur:"—"}<small style="font-size:14px;color:var(--zinc-500);font-weight:700"> kg</small></div></div>`;
  if(g){
    h+=`<div><div class="label">Meta</div><div class="mono" style="font-size:22px;font-weight:800;color:var(--zinc-300);line-height:1.5">${g.target}<small style="font-size:12px;color:var(--zinc-600)"> kg</small></div></div>`;
    if(cur!=null){const diff=g.target-cur;
      h+=`<div><div class="label">Falta</div><div class="mono" style="font-size:22px;font-weight:800;line-height:1.5;color:${Math.abs(diff)<0.15?'var(--emerald)':'var(--amber-250)'}">${diff>0?"+":""}${diff.toFixed(1)}<small style="font-size:12px;color:var(--zinc-600)"> kg</small></div></div>`;}
  }
  h+=`</div>`;
  if(g&&cur!=null&&g.startKg!=null&&g.target!==g.startKg){
    const p=Math.max(0,Math.min(100,Math.round((cur-g.startKg)/(g.target-g.startKg)*100)));
    h+=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><div class="bar"><i style="width:${p}%"></i></div><div class="mono muted" style="font-size:12px;min-width:34px;text-align:right">${p}%</div></div>`;
  }
  h+=sparkline(logs.map(l=>l.kg));
  if(g&&g.startKg!=null&&cur!=null&&logs.length>=1){
    const wk=weeksBetween(g.startDate,logs[logs.length-1].date);
    const expected=g.startKg+parseFloat(g.rate)*wk;
    const delta=cur-expected, dir=parseFloat(g.rate);
    let status,color;
    if(Math.abs(delta)<=0.6){status="Vas en línea con tu meta";color="var(--emerald)";}
    else if((dir>=0&&delta>0)||(dir<0&&delta<0)){status="Vas adelantado a lo esperado";color="var(--sky)";}
    else{status="Vas un poco atrasado";color="var(--amber-250)";}
    h+=`<div style="margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(24,24,27,.5);border:1px solid rgba(63,63,70,.35)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="label">Esperado hoy · ${RATE_LABEL[g.rate]||g.rate}</span>
        <span class="mono" style="font-weight:800;color:var(--zinc-200)">${expected.toFixed(1)} kg</span></div>
      <div style="margin-top:6px;color:${color};font-weight:700;font-size:13px">${status}</div></div>`;
  }
  h+=`</div>`;
  return h;
}
function strengthBlock(){
  const byEx={};
  (S.history||[]).forEach(l=>{if(l.weight!=null)(byEx[l.exId]=byEx[l.exId]||[]).push(l);});
  const ids=Object.keys(byEx);

    return `<div class="card" style="padding:24px;text-align:center"><div class="ei" style="margin:0 auto 12px;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(63,63,70,.2);border:1px solid rgba(63,63,70,.4)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--zinc-500)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg></div><div class="h3" style="font-size:14px">Sin datos de fuerza aún</div><p class="sub" style="margin-top:6px">Tras entrenar, ve a <b style="color:var(--zinc-300)">Hoy → Registrar pesos</b>. Aquí verás cómo sube tu fuerza y tu próximo objetivo.</p></div>`;
  }
  ids.sort((a,b)=>{const la=byEx[a],lb=byEx[b];return (lb[lb.length-1].date<la[la.length-1].date)?-1:1;});
  let h=`<div class="list-stagger">`;
  ids.forEach(id=>{
    const e=getEx(id);if(!e)return;
    const logs=byEx[id].slice().sort((a,b)=>a.date<b.date?-1:1);
    const first=logs[0],last=logs[logs.length-1];
    const chg=last.weight-first.weight;
    const e1rm=Math.round(last.weight*(1+(last.reps||8)/30));
    const sug=nextTarget(e,last);
    h+=`<div class="card" style="padding:15px;margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px">
        <div style="min-width:0"><div class="h3" style="font-size:14px">${e.name}</div>
          <div class="ex-meta">${e.group} · ${logs.length} sesi${logs.length>1?'ones':'ón'}</div></div>
        <div style="text-align:right"><div class="mono" style="font-size:18px;font-weight:800">${last.weight}<small style="color:var(--zinc-500);font-size:11px"> kg</small></div>
          <div class="mono" style="font-size:11px;font-weight:700;color:${chg>0?'var(--emerald)':chg<0?'var(--rose)':'var(--zinc-500)'}">${chg>0?"▲ +"+chg.toFixed(1):chg<0?"▼ "+chg.toFixed(1):"sin cambio"}${chg!==0?" kg":""}</div></div>
      </div>
      ${sparkline(logs.map(l=>l.weight),"#34d399")}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid rgba(63,63,70,.3)">
        <div><div class="label" style="letter-spacing:.1em">1RM estimado</div><div class="mono" style="font-weight:700;font-size:13px;color:var(--zinc-300)">${e1rm} kg</div></div>
        <div style="text-align:right"><div class="label" style="letter-spacing:.1em">Próximo objetivo</div><div class="mono" style="font-weight:700;font-size:13px;color:var(--zinc-100)">${sug}</div></div>
      </div>
    </div>`;
  });
  h+=`</div>`;

  return h;
}
function nextTargetObj(e,last){
  if(!last||last.weight==null)return null;
  const timeBased=typeof e.reps==="string"&&/s\s*$/.test(e.reps);
  const m=(typeof e.reps==="string")?e.reps.match(/(\d+)\s*-\s*(\d+)/):null;
  const upper=m?parseInt(m[2]):(parseInt(e.reps)||10);
  const lower=m?parseInt(m[1]):upper;
  if(timeBased)return {weight:last.weight,reps:last.reps||0};
  if((last.reps||0)>=upper){
    const inc=/Barra|Máquina|Prensa/i.test(e.eq)?2.5:1;
    return {weight:+(last.weight+inc).toFixed(1),reps:lower};
  }
  return {weight:last.weight,reps:(last.reps||0)+1};
}
function nextTarget(e,last){const o=nextTargetObj(e,last);return o?`${o.weight} kg × ${o.reps}`:"—";}
function lastEntry(exId){const l=(S.history||[]).filter(x=>x.exId===exId&&x.weight!=null).sort((a,b)=>a.date<b.date?-1:1);return l.length?l[l.length-1]:null;}
function bindProgreso(){
  const lw=$("#logWeight");if(lw)lw.onclick=openWeightSheet;
  const eg=$("#editGoal");if(eg)eg.onclick=openGoalSheet;
  const ed=$("#expData");if(ed)ed.onclick=exportData;
  const im=$("#impData"),imf=$("#impFile");
  if(im&&imf){im.onclick=()=>imf.click();imf.onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value="";};}
}
function openWeightSheet(){
  const last=(S.weightLog||[]).slice(-1)[0];
  openSheet(`<div class="sheet-grab"></div><div class="sheet-head"><div class="h2">Registrar peso</div><button class="close-x" data-close>×</button></div>
    <div class="field" style="margin-top:12px"><label>Peso de hoy (kg)</label><input type="number" inputmode="decimal" id="wv" placeholder="${last?last.kg:'kg'}"></div>
    <p class="muted" style="margin-bottom:14px">Pésate a la misma hora (ideal en ayunas). Un solo registro por día.</p>
    <button class="btn-primary" style="width:100%" id="saveW">Guardar</button>`);
  $("#saveW").onclick=()=>{
    const v=parseFloat($("#wv").value);if(!v)return toast("Ingresa un peso");
    const date=todayKey();
    S.weightLog=(S.weightLog||[]).filter(l=>l.date!==date);
    S.weightLog.push({date,kg:v});
    if(S.weightGoal&&S.weightGoal.startKg==null){S.weightGoal.startKg=v;S.weightGoal.startDate=date;}
    if(S.profile)S.profile.weight=v;
    save();closeSheet();renderProgreso();toast("Peso registrado");
  };
}
function openGoalSheet(){
  const g=S.weightGoal||{};
  const cur=(S.weightLog||[]).slice(-1)[0];
  const defRate=g.rate||goalRateFromNutrition();
  openSheet(`<div class="sheet-grab"></div><div class="sheet-head"><div class="h2">Meta de peso</div><button class="close-x" data-close>×</button></div>
    <div class="field" style="margin-top:12px"><label>Peso objetivo (kg)</label><input type="number" inputmode="decimal" id="gt" value="${g.target||''}" placeholder="kg"></div>
    <div class="field"><label>Ritmo objetivo</label><select id="gr">${Object.keys(RATE_LABEL).map(r=>`<option value="${r}"${r===defRate?" selected":""}>${RATE_LABEL[r]}</option>`).join("")}</select></div>
    <p class="muted" style="margin-bottom:14px">El ritmo se sugiere según tu objetivo en Nutrición. La app lo usa para estimar si vas en línea, adelantado o atrasado.</p>
    <button class="btn-primary" style="width:100%" id="saveG">Guardar meta</button>`);
  $("#saveG").onclick=()=>{
    const t=parseFloat($("#gt").value);if(!t)return toast("Ingresa el peso objetivo");
    const startKg=g.startKg!=null?g.startKg:(cur?cur.kg:(S.profile?S.profile.weight:t));
    const startDate=g.startDate||todayKey();
    S.weightGoal={target:t,rate:$("#gr").value,startKg,startDate};
    save();closeSheet();renderProgreso();toast("Meta guardada");
  };
}

/* ---------- Respaldo de datos (export / import) ---------- */
function backupCard(){
  return `<div class="card section-gap" style="padding:16px">
    <div class="h3" style="font-size:14px;margin-bottom:4px">Respaldo de datos</div>
    <p class="sub" style="margin-bottom:12px">Tu progreso se guarda en este dispositivo. Exporta un respaldo para no perderlo nunca; impórtalo en otro celular o si reinstalas.</p>
    <div style="display:flex;gap:8px">
      <button class="btn-secondary" id="expData" style="flex:1">Exportar</button>
      <button class="btn-secondary" id="impData" style="flex:1">Importar</button>
    </div>
    <input type="file" id="impFile" accept="application/json,.json" style="display:none">
  </div>`;
}
function exportData(){
  try{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="stick-fit-respaldo-"+todayKey()+".json";
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},120);
    toast("Respaldo descargado");
  }catch(e){toast("No se pudo exportar");}
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    let obj;try{obj=JSON.parse(r.result);}catch(e){return toast("Archivo inválido");}
    if(!obj||!Array.isArray(obj.routines))return toast("Respaldo no válido");
    if(!confirm("Esto reemplazará tus datos actuales con los del respaldo. ¿Continuar?"))return;
    obj.onboarded=true;
    localStorage.setItem(KEY,JSON.stringify(obj));
    toast("Datos restaurados");
    setTimeout(()=>location.reload(),450);
  };
  r.readAsText(file);
}

/* ---------- Plan de comidas (nutrición) ---------- */
const MEAL_DIST=[["Desayuno",0.28],["Almuerzo",0.34],["Cena",0.28],["Snack",0.10]];
const MEAL_PLANS=[
  {n:"Día 1",m:{Desayuno:["Avena con leche","3 huevos revueltos","1 plátano"],Almuerzo:["Pechuga de pollo a la plancha","Arroz integral","Ensalada con aceite de oliva"],Cena:["Salmón al horno","Camote","Brócoli al vapor"],Snack:["Yogur griego","Puñado de almendras","Batido de proteína"]}},
  {n:"Día 2",m:{Desayuno:["Tortilla de 3 huevos con espinaca","Pan integral","Fruta de temporada"],Almuerzo:["Carne magra de res","Quinoa","Verduras salteadas"],Cena:["Pechuga de pavo","Papa cocida","Ensalada verde"],Snack:["Queso cottage","Manzana","Mantequilla de maní"]}},
  {n:"Día 3",m:{Desayuno:["Yogur griego con granola","2 huevos duros","Arándanos"],Almuerzo:["Pescado blanco","Arroz","Frijoles con aguacate"],Cena:["Lomo de cerdo magro","Puré de camote","Judías verdes"],Snack:["Batido de proteína con avena","Nueces","Zanahoria"]}},
];
function mealPlanHTML(kcal,protein){
  let h=`<div class="label-mono section-gap" style="margin-bottom:10px">3 días de ejemplo · ~${kcal} kcal / día</div>`;
  MEAL_PLANS.forEach(day=>{
    h+=`<div class="card" style="padding:16px;margin-bottom:10px"><div class="h3" style="font-size:14px;margin-bottom:10px">${day.n}</div>`;
    MEAL_DIST.forEach(([meal,frac],i)=>{
      const mk=Math.round(kcal*frac);
      h+=`<div class="mp-meal${i===0?' first':''}"><div class="mp-meal-head"><span class="mp-meal-name">${meal}</span><span class="chip mono">${mk} kcal</span></div>
        <div class="mp-foods">${day.m[meal].map(f=>`<span>${f}</span>`).join("")}</div></div>`;
    });
    h+=`</div>`;
  });
  h+=`<div class="card" style="padding:14px 16px;display:flex;gap:12px;align-items:flex-start;background:rgba(52,211,153,.05);border-color:rgba(52,211,153,.2)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.8" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
    <p class="sub" style="font-size:12px">Ejemplos orientativos para repartir tus ~${kcal} kcal y ~${protein} g de proteína al día. Ajusta las porciones para acercarte a esos números; prioriza la proteína en cada comida.</p></div>`;
  return h;
}

/* ============================================================
   NAVEGACIÓN + INIT
   ============================================================ */
const VIEWS=[["hoy","Hoy"],["progreso","Progreso"],["rutinas","Rutinas"],["ejercicios","Ejercicios"],["nutricion","Nutrición"]];
function renderDock(){
  $("#dock").innerHTML=VIEWS.map(([id,l])=>`<button class="dock-btn${id===curView?" on":""}" data-view="${id}">${IC[id]}<span class="dl">${l}</span></button>`).join("");
  $("#dock").querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>go(b.dataset.view));
}
function go(v){
  curView=v;
  document.querySelectorAll(".view").forEach(el=>el.classList.remove("on"));
  const el=$("#v-"+v);el.classList.add("on");el.classList.remove("animate-page");void el.offsetWidth;el.classList.add("animate-page");
  ({hoy:renderHoy,progreso:renderProgreso,rutinas:renderRutinas,ejercicios:renderEjercicios,nutricion:renderNutricion})[v]();
  renderDock();
  $("#headerSub").textContent=VIEWS.find(x=>x[0]===v)[1].toUpperCase();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- Sheet helpers ---------- */
function openSheet(html){$("#sheet").innerHTML=html;$("#overlay").classList.add("open");
  $("#sheet").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);}
function closeSheet(){$("#overlay").classList.remove("open");}
$("#overlay").onclick=e=>{if(e.target===$("#overlay"))closeSheet();};

/* ---------- Toast ---------- */
let toastT;
function toast(msg){$("#toastMsg").textContent=msg;$("#toast").classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>$("#toast").classList.remove("show"),1900);}

/* ---------- Portada ---------- */
$("#enterBtn").onclick=()=>{S.onboarded=true;save();$("#cover").style.display="none";$("#app").style.display="block";go("hoy");};
$("#coverBtn").onclick=()=>{$("#cover").style.display="flex";$("#app").style.display="none";};

/* ---------- Arranque ---------- */
renderDock();
if(S.onboarded){$("#cover").style.display="none";$("#app").style.display="block";go("hoy");}
else{go("hoy");}

if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
